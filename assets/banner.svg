<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071b2e" />
      <stop offset="100%" stop-color="#0d233a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Card Fill Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #e0e8f5;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #00f2fe;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .float-card {
      animation: float 4s infinite ease-in-out;
    }
    .dna-wave {
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Dynamic Background Grid / Molecule Network (Background Layer - Behind Text) -->
  <g opacity="0.25">
    <line x1="100" y1="50" x2="250" y2="120" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="250" y1="120" x2="200" y2="280" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="250" y1="120" x2="450" y2="80" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="950" y1="60" x2="1100" y2="160" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="1100" y1="160" x2="1000" y2="290" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="800" y1="240" x2="1000" y2="290" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Molecular Nodes -->
    <circle cx="100" cy="50" r="6" fill="#00f2fe" />
    <circle cx="250" cy="120" r="9" fill="#ff0844" filter="url(#subtle-glow)" />
    <circle cx="200" cy="280" r="7" fill="#00f2fe" />
    <circle cx="450" cy="80" r="5" fill="#4facfe" />
    <circle cx="950" cy="60" r="8" fill="#00f2fe" />
    <circle cx="1100" cy="160" r="10" fill="#4facfe" filter="url(#subtle-glow)" />
    <circle cx="1000" cy="290" r="6" fill="#ff0844" />
    <circle cx="800" cy="240" r="7" fill="#00f2fe" />
  </g>

  <!-- Animated Helix Path (Dynamic Aspect - Dynamic Waves in Lower Area) -->
  <path d="M 50 290 Q 200 240 350 290 T 650 290 T 950 290 T 1150 290" fill="none" stroke="url(#text-grad)" stroke-width="3" stroke-dasharray="12,12" opacity="0.4" class="dna-wave" />
  <path d="M 50 290 Q 200 340 350 290 T 650 290 T 950 290 T 1150 290" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="8,8" opacity="0.3" class="dna-wave" />

  <!-- Background Decorative Glass Cards (Positioned Away From Central Text) -->
  <!-- Left Feature Pillar -->
  <g transform="translate(60, 80)">
    <rect width="180" height="150" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="40" cy="40" r="16" fill="#00f2fe" fill-opacity="0.15" />
    <path d="M32 40 L40 32 L48 40 L40 48 Z" fill="#00f2fe" />
    <text x="40" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Target ID</text>
    <text x="40" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0aec0">Multi-omics &amp; LLMs</text>
    <text x="40" y="120" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00f2fe">AlphaFold • ESM</text>
  </g>

  <!-- Right Feature Pillar -->
  <g transform="translate(960, 80)">
    <rect width="180" height="150" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="40" cy="40" r="16" fill="#ff0844" fill-opacity="0.15" />
    <path d="M35 35 L45 35 L45 45 L35 45 Z" fill="#ff0844" />
    <text x="40" y="80" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Lead Opt</text>
    <text x="40" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0aec0">Docking &amp; Physics</text>
    <text x="40" y="120" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ff0844">Vina • RDKit • OpenMM</text>
  </g>

  <!-- Central Foreground Content (Unobstructed & Prominent) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="475" y="45" width="250" height="28" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <text x="600" y="64" class="tagline">✦ Computational Biology &amp; AI ✦</text>

    <!-- Main Title with Glow -->
    <text x="600" y="135" class="title" filter="url(#glow)">Awesome Drug Discovery AI</text>
    <text x="600" y="135" class="title">Awesome Drug Discovery AI</text>

    <!-- Subtitle -->
    <text x="600" y="178" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects</text>
    
    <!-- Key Modules / Pills -->
    <g transform="translate(340, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="75" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00f2fe">🧪 Virtual Screening</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="190" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="260" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">🧬 Structure Prediction</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="445" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffb199">💊 Lead Optimization</text>
    </g>

    <!-- Footer Stats / Meta Line -->
    <text x="600" y="275" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8a99ad">
      Physics-Based Modeling • Machine Learning • Generative Chemistry • Structural Bioinformatics
    </text>
  </g>
</svg>
